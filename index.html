<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poem Slide Showdown</title>
<style>
:root{--bg:#faf8f3;--fg:#1c1b1a;--mut:#74706a;--card:#fff;--line:#d9d4c8;--acc:#b3412b}
@media(prefers-color-scheme:dark){:root{--bg:#171615;--fg:#f1ede4;--mut:#a39e94;--card:#232120;--line:#3a3733;--acc:#e8836b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Georgia,serif}
header{text-align:center;padding:20px 12px 6px}h1{margin:0;font-size:1.7rem}
.sub{color:var(--mut);font-family:system-ui,sans-serif;font-size:.9rem}
main{max-width:1100px;margin:auto;padding:8px 14px 40px}
.stage{text-align:center;font:600 .85rem system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin:10px 0}
.fight{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.vs{font:700 1.2rem system-ui,sans-serif;color:var(--mut)}
.slide{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;font:inherit;color:inherit;transition:.15s}
.slide:hover,.slide:focus-visible{border-color:var(--acc);transform:translateY(-3px);outline:none}
.slide img{width:100%;display:block;border-radius:4px;background:#fff}
.slide span{display:block;text-align:center;font:600 .9rem system-ui,sans-serif;margin-top:6px}
.btns{text-align:center;margin:14px 0}
button.b,a.b{font:600 .95rem system-ui,sans-serif;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;margin:4px;text-decoration:none;display:inline-block}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.bracket{display:flex;gap:14px;overflow-x:auto;padding:8px 0;font:.78rem/1.3 system-ui,sans-serif}
.col{min-width:150px;display:flex;flex-direction:column;justify-content:space-around;gap:8px}
.col h3{margin:0;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.m{border:1px solid var(--line);border-radius:6px;background:var(--card);overflow:hidden}
.m div{padding:3px 7px;color:var(--mut)}.m div.w{color:var(--fg);font-weight:700;background:color-mix(in srgb,var(--acc) 14%,transparent)}
.m div.l{text-decoration:line-through}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pod{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px}
.pod h2{margin:0 0 6px;font:700 .85rem system-ui,sans-serif;color:var(--acc);text-transform:uppercase;letter-spacing:.08em}
.pod img{width:100%;border-radius:4px;background:#fff}
textarea{width:100%;min-height:70px;margin-top:8px;font:inherit;font-size:.9rem;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
details{margin-top:16px}summary{cursor:pointer;font:600 .9rem system-ui,sans-serif;color:var(--mut)}
.note{text-align:center;color:var(--mut);font:.85rem system-ui,sans-serif;min-height:1.3em}
@media(max-width:640px){.fight{grid-template-columns:1fr;gap:6px}.vs{text-align:center}.podium{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Poem Slide Showdown</h1><div class="sub" id="sub"></div></header>
<main id="app"></main>
<script>
const TO="sarajc@chalkpost.org";
const T=["Laundry","The Lotus","October 22nd","To autumn: late youth","Seasons","Liar","Note","Pick a card","sleep","The beauty of autumn","Rocket","Mirror","Finding Home","Pokéball","Mr. Owl ate my metal worm","An Eternal Life","Messy Room"];
const img=i=>"s-"+String(i+1).padStart(2,"0")+".jpg";
const KEY="poemBracket1";
let S;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function fresh(){const ids=shuffle([...T.keys()]);
 // play-in: first two; remaining 15 wait
 return{rounds:[{name:"Play-in",m:[{a:ids[0],b:ids[1],w:null}]}],wait:ids.slice(2),sfLosers:[],champ:null,second:null,third:null,notes:["","",""]}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.rounds)return s}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const cur=()=>S.rounds[S.rounds.length-1];
const nextMatch=()=>cur().m.find(x=>x.w===null);
function names(n,size){return n}
function pick(w){
 const r=cur(),m=nextMatch();m.w=w;const l=w===m.a?m.b:m.a;
 if(r.name==="Semifinals")S.sfLosers.push(l);
 if(r.name==="Third place"){S.third=w}
 if(r.name==="Final"){S.champ=w;S.second=l}
 if(!r.m.every(x=>x.w!==null)){save();return render()}
 const win=r.m.map(x=>x.w);
 const pair=a=>{const o=[];for(let i=0;i<a.length;i+=2)o.push({a:a[i],b:a[i+1],w:null});return o};
 if(r.name==="Play-in"){const f=shuffle([win[0],...S.wait]);S.rounds.push({name:"Round of 16",m:pair(f)})}
 else if(r.name==="Round of 16")S.rounds.push({name:"Quarterfinals",m:pair(win)});
 else if(r.name==="Quarterfinals")S.rounds.push({name:"Semifinals",m:pair(win)});
 else if(r.name==="Semifinals"){S.finalists=win;S.rounds.push({name:"Third place",m:[{a:S.sfLosers[0],b:S.sfLosers[1],w:null}]})}
 else if(r.name==="Third place")S.rounds.push({name:"Final",m:[{a:S.finalists[0],b:S.finalists[1],w:null}]});
 save();render();
}
function bracketHTML(){
 return '<div class="bracket">'+S.rounds.map(r=>'<div class="col"><h3>'+r.name+'</h3>'+r.m.map(m=>{
  const c=(id)=>'<div class="'+(m.w===null?'':m.w===id?'w':'l')+'">'+T[id]+'</div>';
  return '<div class="m">'+c(m.a)+c(m.b)+'</div>'}).join('')+'</div>').join('')+'</div>';
}
function report(){
 const p=[["1st (Champion)",S.champ],["2nd (Runner-up)",S.second],["3rd",S.third]];
 return "My top 3 poem slides:\n\n"+p.map((x,i)=>x[0]+": "+T[x[1]]+(S.notes[i]?"\n   Notes: "+S.notes[i]:"")).join("\n\n");
}
function render(){
 const app=document.getElementById("app"),sub=document.getElementById("sub");
 const m=nextMatch();
 if(m){
  const r=cur();sub.textContent="Click the slide you like better. 17 poems, one winner.";
  const left=r.m.filter(x=>x.w===null).length;
  app.innerHTML='<div class="stage">'+r.name+' · match '+(r.m.length-left+1)+' of '+r.m.length+'</div><div class="fight">'+
   card(m.a)+'<div class="vs">VS</div>'+card(m.b)+'</div><div class="btns"><button class="b" id="rs">Start over</button></div><details open><summary>Bracket so far</summary>'+bracketHTML()+'</details>';
  app.querySelectorAll(".slide").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  document.getElementById("rs").onclick=()=>{if(confirm("Start over with a new random bracket?")){S=fresh();save();render()}};
 }else{
  sub.textContent="Your top 3 are ready. Add notes, then send or save.";
  const p=[["1st · Champion",S.champ],["2nd · Runner-up",S.second],["3rd Place",S.third]];
  app.innerHTML='<div class="podium">'+p.map((x,i)=>'<div class="pod"><h2>'+x[0]+'</h2><img src="'+img(x[1])+'" alt="'+T[x[1]]+'"><strong>'+T[x[1]]+'</strong><textarea data-n="'+i+'" placeholder="Why does this one stand out? (optional)">'+S.notes[i]+'</textarea></div>').join('')+'</div>'+
  '<div class="btns"><a class="b p" id="mail" href="#">Email to '+TO+'</a><button class="b" id="cp">Copy results</button><button class="b" id="dl">Download results (.txt)</button><button class="b" id="rs">Play again</button></div><div class="note" id="msg"></div>'+
  '<details><summary>Full bracket</summary>'+bracketHTML()+'</details>';
  const upd=()=>{document.getElementById("mail").href="mailto:"+TO+"?subject="+encodeURIComponent("My top 3 poem slides")+"&body="+encodeURIComponent(report())};
  upd();
  app.querySelectorAll("textarea").forEach(t=>t.oninput=()=>{S.notes[+t.dataset.n]=t.value;save();upd()});
  const msg=t=>document.getElementById("msg").textContent=t;
  document.getElementById("cp").onclick=()=>navigator.clipboard.writeText(report()).then(()=>msg("Copied!"),()=>msg("Copy failed. Use the download button instead."));
  document.getElementById("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([report()],{type:"text/plain"}));a.download="my-top-3-poems.txt";a.click()};
  document.getElementById("rs").onclick=()=>{S=fresh();save();render()};
 }
}
const card=i=>'<button class="slide" data-i="'+i+'"><img src="'+img(i)+'" alt="'+T[i]+'"><span>'+T[i]+'</span></button>';
S=load();render();
</script></body></html>
